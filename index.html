<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Slime TD</title>
    <style>
      :root {
        --bg: #0b060a;
        --bg2: #150a10;
        --accent: #6df0ff;
        --accent-dim: #2c6b74;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(ellipse at center, var(--bg2) 0%, var(--bg) 75%);
        font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
        color: #f2e9ee;
        user-select: none;
      }
      #game-canvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
